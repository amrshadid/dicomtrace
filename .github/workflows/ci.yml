name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The parser runs as an external executable. Pin the release and its
  # SHA-256 here, so a replaced release asset fails the build instead of running.
  GO_DICOM_VERSION: v1.9.1
  GO_DICOM_LINUX_AMD64_SHA256: b93006f4dc667eb869eab824af9cebe89c3d801539f4355a1d578f20ca109342
  GO_DICOM_MACOS_ARM64_SHA256: 72cf1ca844078f6541d134cebdee3b59560279666ccebaca82a4e18f8403a9db
  GO_DICOM_WINDOWS_AMD64_SHA256: 4a84f55349fdc60997ad21e17c6a4de68330b9695382e4f920c21a051d05315b

jobs:
  check:
    name: Lint, types, tests, audit and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Install go-dicom (checksum-verified)
        run: |
          mkdir -p "${RUNNER_TEMP}/go-dicom"
          bin="${RUNNER_TEMP}/go-dicom/go-dicom"
          curl -fsSL -o "${bin}" \
            "https://github.com/amrshadid/go-dicom/releases/download/${GO_DICOM_VERSION}/go-dicom-linux-amd64"
          echo "${GO_DICOM_LINUX_AMD64_SHA256}  ${bin}" | sha256sum -c -
          chmod +x "${bin}"
          "${bin}" version
          echo "GO_DICOM_PATH=${bin}" >> "${GITHUB_ENV}"
      # GO_DICOM_PATH enables the ≥ 200 MB file test (test/golden/bigFile.test.ts).
      - run: npm run test:coverage
      # Fail on known advisories in anything that ships; dev-only tooling is excluded.
      - run: npm audit --omit=dev
      - name: Production build within the bundle budgets
        run: npm run build:prod

  integration:
    name: Integration (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The acceptance tests drive go-dicom; each runner gets its checksum-verified binary.
      - name: Install go-dicom (checksum-verified)
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Linux) asset=go-dicom-linux-amd64; sum="${GO_DICOM_LINUX_AMD64_SHA256}"; name=go-dicom ;;
            macOS) asset=go-dicom-macos-arm64; sum="${GO_DICOM_MACOS_ARM64_SHA256}"; name=go-dicom ;;
            Windows) asset=go-dicom-windows-amd64.exe; sum="${GO_DICOM_WINDOWS_AMD64_SHA256}"; name=go-dicom.exe ;;
          esac
          mkdir -p "${RUNNER_TEMP}/go-dicom"
          bin="${RUNNER_TEMP}/go-dicom/${name}"
          curl -fsSL -o "${bin}" "https://github.com/amrshadid/go-dicom/releases/download/${GO_DICOM_VERSION}/${asset}"
          # Hash by bare file name: on Windows, sha256sum prefixes its output with "\" when the
          # path contains backslashes, which broke the comparison.
          actual="$(cd "$(dirname "${bin}")" && (sha256sum "${name}" 2>/dev/null || shasum -a 256 "${name}") | cut -d' ' -f1)"
          if [ "${actual}" != "${sum}" ]; then echo "::error::go-dicom checksum mismatch"; exit 1; fi
          chmod +x "${bin}"
          echo "GO_DICOM_PATH=${bin}" >> "${GITHUB_ENV}"
      - name: Run integration tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration tests
        if: runner.os == 'macOS'
        run: npm run test:integration
      # Windows can't force CPU rendering (Chromium falls back to WARP software WebGL), so
      # it runs the main configuration only; the HiDPI CPU run is covered on Linux and macOS.
      - name: Run integration tests (main configuration)
        if: runner.os == 'Windows'
        run: npm run test:integration -- --label main

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
